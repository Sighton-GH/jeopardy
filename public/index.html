<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f62a5"><link rel="icon" type="image/svg+xml" href="/brand/sighton-logo.svg"><title>Sighton Jeopardy - Join or create</title><link rel="stylesheet" href="/style.css"></head><body class="landing"><header class="topbar"><div class="brand"><img class="sighton-logo" src="/brand/sighton-logo.svg" alt="Sighton Media"><span>Sighton Jeopardy</span></div><a href="/create">Create a game ↗</a></header><main class="landing-main"><section class="intro"><h1>Jeopardy <span>game</span></h1><p class="sighton-credit">developed by <a href="https://sighton.ca/">Sighton Media</a></p></section><section class="entry" aria-labelledby="join-title"><h2 id="join-title">Join a game</h2><form id="join"><label for="code">Game code</label><input id="code" name="code" autocomplete="off" inputmode="numeric" placeholder="6-digit code" maxlength="6" minlength="6" pattern="[0-9]{6}" required><label for="team">Team name</label><input id="team" name="team" autocomplete="off" placeholder="Your team" maxlength="30" required><button class="primary" type="submit">Join</button></form><div class="create-line"><span>Hosting?</span><a class="outline" href="/create">Create game</a></div></section></main><script type="module" src="/app.ts"></script></body></html>
