<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>SLxCA Jeopardy - Join or create</title><link rel="stylesheet" href="/style.css"></head><body class="landing"><header class="topbar"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>SLxCA <small>Jeopardy</small></div><a href="/create">Create a game ↗</a></header><main class="landing-main"><section class="intro"><div class="event">SLxCA Jeopardy</div><h1>Let's <span>play.</span></h1></section><section class="entry" aria-labelledby="join-title"><h2 id="join-title">Join a game</h2><form id="join"><label for="code">Game code</label><input id="code" name="code" autocomplete="off" autocapitalize="characters" placeholder="8-character code" maxlength="8" minlength="8" pattern="[A-Za-z2-9]{8}" required><label for="team">Team name</label><input id="team" name="team" autocomplete="off" placeholder="Your team" maxlength="30" required><button class="primary" type="submit">Join game →</button></form><div class="create-line"><span>Hosting?</span><a class="outline" href="/create">Create a game →</a></div></section></main><script type="module" src="/app.ts"></script></body></html>
