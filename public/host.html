<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1020"><link rel="icon" type="image/svg+xml" href="/brand/sighton-logo.svg"><title>Sighton Jeopardy - Host</title><link rel="stylesheet" href="/host.css"></head><body class="host">
<header class="host-header"><div class="host-brand"><button class="host-back" id="cmd-back" type="button" disabled aria-label="Back to board">← Back</button><img class="network-mark" src="/brand/schulich-network.webp" alt="Schulich Leader Network"><img class="sighton-logo" src="/brand/sighton-logo.svg" alt="Sighton Media"><strong>Sighton Jeopardy</strong><img class="host-wordmark" src="/brand/slxca-wordmark.webp" alt="SLxCA"><span>Jeopardy!</span></div><div class="room-code" id="room-code"></div><button id="settings-open" class="settings-open" type="button" aria-label="Room settings" aria-expanded="false" title="Room settings">⚙</button></header>

<main class="host-content">
<section class="board-area" aria-label="Jeopardy board"><div class="board-wrap"><div class="board" id="board"></div><div class="reveal" id="reveal" hidden><div class="kicker" id="reveal-kicker"></div><div class="clue" id="reveal-clue"></div><div class="buzzed" id="reveal-buzzed" hidden></div><div class="answer" id="reveal-answer" hidden><b>ANSWER</b><span id="reveal-answer-text"></span></div><div class="clock" id="reveal-clock" hidden></div><div class="reading-bar" id="reading-bar" hidden role="progressbar" aria-label="Clue reading time remaining"><span id="reading-fill"></span></div><div class="slide-controls" id="slide-controls" aria-label="Host controls" hidden><button id="cmd-arm" type="button" hidden>Arm buzzers</button><button id="cmd-correct" type="button" hidden>&#10003; Correct</button><button id="cmd-wrong" type="button" hidden>&#10005; Incorrect</button><button id="cmd-resolved-back" type="button" hidden>&larr; Back to board</button></div></div></div>

<footer class="host-foot"><div class="host-foot-left"><div class="host-schools" aria-label="Participating schools"><img src="/brand/ubc.webp" alt="UBC"><img src="/brand/sfu.webp" alt="SFU"><img src="/brand/uvic.webp" alt="UVic"></div><span class="round-meta"><strong>Round 1</strong><span id="clues-left"></span></span></div><div class="notice" id="notice"></div></footer></section>
<aside class="host-side" aria-label="Game information">
<section class="side-section"><h2>Scores</h2><div id="scores"></div></section>
<section class="side-section"><h2>Buzzers</h2><div class="status"><span class="hint" id="status-hint"></span><strong id="status-main">&mdash;</strong><span class="hint" id="status-sub"></span><div class="clock" id="status-clock" hidden></div></div><div class="queue" id="queue"></div></section>

</aside></main>
<dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><form id="settings-form"><h2 id="settings-title">Room settings</h2><label>Max players <input id="set-max" type="number" min="1" max="10" required></label><label>Answer time (seconds) <input id="set-answer" type="number" min="5" max="120" required></label><label class="check"><input id="set-auto" type="checkbox"> Auto reading timer</label><label>Reading seconds per word <input id="set-reading" type="number" min="0.2" max="2" step="0.05" required></label><p>Reading time scales with clue length, from 5 to 60 seconds. New settings take effect on the next clue.</p><div class="settings-actions"><button id="end-game" type="button">End game</button><button id="settings-close" type="button">Cancel</button><button type="submit">Save settings</button></div></form></dialog>
<div class="gate" id="gate" hidden><form class="card" id="gate-form"><h1>Host board</h1><p>Open this page from your private host link, or enter the room details.</p><label for="gate-code">Room code</label><input id="gate-code" maxlength="6" minlength="6" inputmode="numeric" autocomplete="off" placeholder="123456"><label for="gate-token">Host token</label><input id="gate-token" autocomplete="off" placeholder="From your host link"><button class="primary" type="submit">Open board</button><div class="err" id="gate-err"></div></form></div>
<script type="module" src="/host.ts"></script></body></html>
